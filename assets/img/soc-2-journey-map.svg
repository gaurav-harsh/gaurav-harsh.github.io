<svg width="1200" height="1290" viewBox="0 0 1200 1290" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Tier-2 SOC analyst journey: discovery to review</title>
<rect x="0" y="0" width="1200" height="1290" fill="#FFFFFF"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#1A1A18">Tier-2 SOC analyst journey: discovery to review</text>
<text x="40" y="80" font-size="15" fill="#5F5E5A">Where AI shows up today, where it stalls the analyst, and where it can safely take on more</text>
<line x1="40" y1="102" x2="1160" y2="102" stroke="#E5E3DA" stroke-width="1"/>
<text x="40" y="140" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7FA8C9">DISCOVERY</text>
<rect x="40" y="156" width="1120" height="150" rx="14" fill="#FAF9F5" stroke="#E5E3DA" stroke-width="1"/>
<text x="64" y="188" font-size="18" font-weight="700" fill="#1A1A18">Detect &amp; Tier-1 handoff</text>
<rect x="947" y="176" width="189" height="18" rx="9" fill="#FAEEDA"/><text x="1041.5" y="185" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="middle">EVIDENCE-CHAIN REQUIRED</text>
<text x="64" y="212" font-size="13" fill="#5F5E5A">AI use today: Ticket auto-created from alert; analyst reviews Tier-1&#8217;s notes first</text>
<text x="64" y="246" font-size="13" font-style="italic" fill="#444441">&#8220;&#8230;sometimes I don&#8217;t have the background, like, how did they reach this</text>
<text x="64" y="266" font-size="13" font-style="italic" fill="#444441">conclusion of finding these IPs.&#8221;</text>
<text x="64" y="288" font-size="12" fill="#8A8880">Reasoning is important for the analyst to plan work. Trust signals required.</text>
<rect x="40" y="322" width="1120" height="150" rx="14" fill="#FAF9F5" stroke="#E5E3DA" stroke-width="1"/>
<text x="64" y="354" font-size="18" font-weight="700" fill="#1A1A18">Data gathering</text>
<rect x="1018" y="342" width="118" height="18" rx="9" fill="#CFEFE0"/><text x="1077" y="351" font-size="11" font-weight="700" fill="#085041" text-anchor="middle" dominant-baseline="middle">AUTOMATE NOW</text>
<text x="64" y="378" font-size="13" fill="#5F5E5A">AI use today: Summarizes commands, builds timelines, agentic multi-tool queries</text>
<text x="64" y="412" font-size="13" font-style="italic" fill="#444441">&#8220;I opened thirteen consoles&#8230;we didn&#8217;t find that piece of log&#8230;I&#8217;m super</text>
<text x="64" y="432" font-size="13" font-style="italic" fill="#444441">frustrated.&#8221;</text>
<text x="64" y="454" font-size="12" fill="#8A8880">Involves no decisions or actions. Can be fully automated.</text>
<text x="40" y="512" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7FA8C9">ANALYSIS</text>
<rect x="40" y="528" width="1120" height="150" rx="14" fill="#FAF9F5" stroke="#E5E3DA" stroke-width="1"/>
<text x="64" y="560" font-size="18" font-weight="700" fill="#1A1A18">Correlate &amp; hypothesize</text>
<rect x="947" y="548" width="189" height="18" rx="9" fill="#FAEEDA"/><text x="1041.5" y="557" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="middle">EVIDENCE-CHAIN REQUIRED</text>
<text x="64" y="584" font-size="13" fill="#5F5E5A">AI use today: No confirmed AI use at this stage across sessions</text>
<text x="64" y="618" font-size="13" font-style="italic" fill="#444441">&#8220;The most problematic thing is to jump on different console and search for</text>
<text x="64" y="638" font-size="13" font-style="italic" fill="#444441">the same thing.&#8221;</text>
<text x="64" y="660" font-size="12" fill="#8A8880">Because next steps are planned based on the hypothesis.</text>
<text x="40" y="718" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7FA8C9">CONTAINMENT, ERADICATION &amp; RECOVERY</text>
<rect x="40" y="734" width="1120" height="150" rx="14" fill="#FAF9F5" stroke="#E5E3DA" stroke-width="1"/>
<text x="64" y="766" font-size="18" font-weight="700" fill="#1A1A18">Decide</text>
<rect x="1036" y="754" width="100" height="18" rx="9" fill="#F5C4B3"/><text x="1086" y="763" font-size="11" font-weight="700" fill="#712B13" text-anchor="middle" dominant-baseline="middle">HUMAN-ONLY</text>
<text x="64" y="790" font-size="13" fill="#5F5E5A">AI use today: Used as a confidence check on a conclusion already reached</text>
<text x="64" y="824" font-size="13" font-style="italic" fill="#444441">&#8220;I don&#8217;t rely on AI to determine whether something is malicious&#8230;without</text>
<text x="64" y="844" font-size="13" font-style="italic" fill="#444441">validating the evidence myself.&#8221;</text>
<text x="64" y="866" font-size="12" fill="#8A8880">Final call on maliciousness stays with the analyst.</text>
<rect x="40" y="900" width="1120" height="150" rx="14" fill="#FAF9F5" stroke="#E5E3DA" stroke-width="1"/>
<text x="64" y="932" font-size="18" font-weight="700" fill="#1A1A18">Coordinate &amp; contain</text>
<rect x="988" y="920" width="148" height="18" rx="9" fill="#F5C4B3"/><text x="1062" y="929" font-size="11" font-weight="700" fill="#712B13" text-anchor="middle" dominant-baseline="middle">HUMAN-ONLY TO ACT</text>
<text x="64" y="956" font-size="13" fill="#5F5E5A">AI use today: No confirmed AI use in coordination or containment</text>
<text x="64" y="990" font-size="13" font-style="italic" fill="#444441">&#8220;&#8230;investigation is thirty minutes, coordination is one hour &#8212; double the</text>
<text x="64" y="1010" font-size="13" font-style="italic" fill="#444441">time of investigation.&#8221;</text>
<text x="64" y="1032" font-size="12" fill="#8A8880">Containment is the most critical step, for which the analyst is accountable.</text>
<text x="40" y="1090" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7FA8C9">REVIEW</text>
<rect x="40" y="1106" width="1120" height="150" rx="14" fill="#FAF9F5" stroke="#E5E3DA" stroke-width="1"/>
<text x="64" y="1138" font-size="18" font-weight="700" fill="#1A1A18">Document</text>
<rect x="1018" y="1126" width="118" height="18" rx="9" fill="#CFEFE0"/><text x="1077" y="1135" font-size="11" font-weight="700" fill="#085041" text-anchor="middle" dominant-baseline="middle">AUTOMATE NOW</text>
<text x="64" y="1162" font-size="13" fill="#5F5E5A">AI use today: Drafts notes/reports for review</text>
<text x="64" y="1196" font-size="13" font-style="italic" fill="#444441">&#8220;I&#8217;ve just done twenty things right now, and I didn&#8217;t document it. So now I</text>
<text x="64" y="1216" font-size="13" font-style="italic" fill="#444441">have to go back to impede my workflow.&#8221;</text>
<text x="64" y="1238" font-size="12" fill="#8A8880">AI has advanced enough to do this accurately without severe consequences.</text>
</svg>
