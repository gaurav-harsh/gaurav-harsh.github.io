<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>The ideal AI-native SOC workspace</title>
<rect x="0" y="0" width="1200" height="700" fill="#FFFFFF"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#1A1A18">The ideal AI-native SOC workspace</text>
<text x="40" y="80" font-size="15" fill="#5F5E5A">Capabilities analysts described without asking</text>
<line x1="40" y1="102" x2="1160" y2="102" stroke="#E5E3DA" stroke-width="1"/>
<rect x="40" y="126" width="1120" height="90" rx="12" fill="#0F6E56" fill-opacity="0.06" stroke="#0F6E56" stroke-width="1"/>
<text x="66" y="158" font-size="16" font-weight="700" fill="#085041">Natural-language-query Unified Investigation Surface that provides</text>
<text x="66" y="182" font-size="16" font-weight="700" fill="#085041">bounded proactive suggestions along with personalization over time</text>
<text x="40" y="252" font-size="12" font-weight="700" letter-spacing="1.2" fill="#8A8880">IT SHOULD ALSO PROVIDE</text>
<g font-size="14" fill="#1A1A18">
<circle cx="50" cy="278" r="3" fill="#0F6E56"/><text x="64" y="283">Structured Tier 1&#8594;2 handoff</text>
<circle cx="50" cy="308" r="3" fill="#0F6E56"/><text x="64" y="313">Auto-correlation across tools</text>
<circle cx="50" cy="338" r="3" fill="#0F6E56"/><text x="64" y="343">Passive real-time documentation</text>
<circle cx="50" cy="368" r="3" fill="#0F6E56"/><text x="64" y="373">Documentation-as-training-data pipeline</text>
<circle cx="50" cy="398" r="3" fill="#0F6E56"/><text x="64" y="403">Full automation of known low-risk incidents</text>
</g>
<rect x="40" y="424" width="530" height="76" rx="10" fill="#FAF9F5" stroke="#E5E3DA" stroke-width="1"/>
<text x="60" y="452" font-size="13" font-weight="700" fill="#1A1A18">Approval-gated action layer, and every output</text>
<text x="60" y="472" font-size="13" font-weight="700" fill="#1A1A18">linked to source logs</text>
<line x1="610" y1="240" x2="610" y2="620" stroke="#E5E3DA" stroke-width="1"/>
<text x="640" y="252" font-size="12" font-weight="700" letter-spacing="1.2" fill="#8A8880">WHAT THIS MEANS</text>
<g>
<rect x="640" y="277.5" width="81" height="19" rx="9.5" fill="#CFEFE0"/><text x="680.5" y="287" font-size="14" font-weight="700" fill="#085041" text-anchor="middle" dominant-baseline="middle">~10 min</text>
<text x="744" y="292" font-size="14" fill="#5F5E5A">Saved reconstructing escalation reasoning</text>
<rect x="640" y="321.5" width="81" height="19" rx="9.5" fill="#CFEFE0"/><text x="680.5" y="331" font-size="14" font-weight="700" fill="#085041" text-anchor="middle" dominant-baseline="middle">~15 min</text>
<text x="744" y="336" font-size="14" fill="#5F5E5A">Saved console-hopping to find logs</text>
<rect x="640" y="365.5" width="81" height="19" rx="9.5" fill="#CFEFE0"/><text x="680.5" y="375" font-size="14" font-weight="700" fill="#085041" text-anchor="middle" dominant-baseline="middle">~10 min</text>
<text x="744" y="380" font-size="14" fill="#5F5E5A">Saved in analysis &amp; hypothesis formation</text>
<rect x="640" y="409.5" width="81" height="19" rx="9.5" fill="#CFEFE0"/><text x="680.5" y="419" font-size="14" font-weight="700" fill="#085041" text-anchor="middle" dominant-baseline="middle">~10 min</text>
<text x="744" y="424" font-size="14" fill="#5F5E5A">Saved in documentation</text>
</g>
<rect x="640" y="452" width="520" height="90" rx="12" fill="#1A1A18"/>
<text x="664" y="484" font-size="13" fill="#C2C0B6">MTTC for an investigation that takes 45 min&#8211;2 hrs on average</text>
<text x="664" y="518" font-size="22" font-weight="700" fill="#FFFFFF">Hours &#8594; Minutes</text>
<text x="640" y="568" font-size="12" font-style="italic" fill="#8A8880">Directional &#8212; inferred from where analysts report losing the most time;</text>
<text x="640" y="586" font-size="12" font-style="italic" fill="#8A8880">no session measured containment-time deltas directly.</text>
<text x="640" y="616" font-size="13" fill="#5F5E5A">Additional time can be saved with automated coordination routing.</text>
</svg>
